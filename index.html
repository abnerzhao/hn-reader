<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f3">
  <title>HN Reader</title>
  <link rel="icon" href="hn-reader-favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("assets/fonts/ibm-plex-sans-400.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("assets/fonts/ibm-plex-sans-600.ttf") format("truetype");
      font-weight: 600 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Literata";
      src: url("assets/fonts/literata-variable.ttf") format("truetype");
      font-weight: 200 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --paper: #f5f7f3;
      --panel: #fbfcfa;
      --ink: #17221d;
      --muted: #69746d;
      --line: #dce2db;
      --green: #165b43;
      --green-soft: #e4f0e9;
      --serif: "Literata", Iowan Old Style, Baskerville, "Times New Roman", "Noto Serif SC", serif;
      --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    button, a { color: inherit; font: inherit; }
    button { cursor: pointer; }
    a { text-decoration: none; }

    .shell { width: min(100%, 1180px); margin: 0 auto; padding: 24px 28px 64px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
    .brand { font-weight: 760; letter-spacing: -.045em; font-size: 21px; }
    .brand i { color: var(--green); font-family: var(--serif); font-weight: 500; }
    .brand-note { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .top-note, .source, .footer, .archive-title { color: var(--muted); font: 11px/1.5 var(--mono); letter-spacing: .04em; text-transform: uppercase; }

    .reader-grid { display: grid; grid-template-columns: 250px minmax(0, 640px) 110px; justify-content: space-between; gap: 24px; padding: 52px 0 0; align-items: start; }
    .archive { position: sticky; top: 20px; align-self: start; }
    .archive-title { margin: 0 0 13px; }
    .calendar { width: 100%; }
    .calendar-head { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; margin-bottom: 13px; }
    .calendar-month { margin: 0; color: var(--ink); font: 600 12px/1.3 var(--mono); letter-spacing: .04em; text-align: center; text-transform: uppercase; }
    .calendar-nav { width: 34px; height: 34px; border: 0; background: transparent; color: var(--muted); font: 21px/1 var(--serif); }
    .calendar-nav:hover { color: var(--green); background: var(--green-soft); }
    .calendar-weekdays, .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .calendar-weekdays { margin-bottom: 6px; color: var(--muted); font: 10px/1.4 var(--mono); letter-spacing: -.04em; text-align: center; }
    .calendar-day { position: relative; display: grid; min-height: 36px; place-items: center; border: 0; background: transparent; color: var(--ink); font: 13px/1 var(--mono); }
    .calendar-day:hover { background: #edf1ec; color: var(--green); }
    .calendar-day[aria-pressed="true"] { background: var(--green-soft); color: var(--green); font-weight: 700; }
    .calendar-day.has-article::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--green); }
    .calendar-day[aria-pressed="true"]::after { background: var(--green); }
    .calendar-day.empty { pointer-events: none; }
    .levels { position: sticky; top: 20px; display: grid; gap: 5px; align-self: start; }
    .levels-title { margin: 0 0 8px; color: var(--muted); font: 11px/1.5 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .level { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 46px; border: 0; border-left: 2px solid transparent; background: transparent; color: var(--muted); padding: 0 12px; font-size: 15px; font-weight: 600; line-height: 1.25; text-align: left; transition: color .16s ease, background .16s ease; }
    .level:hover { background: #edf1ec; color: var(--ink); }
    .level[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 730; }
    .reading-meta { margin: 0 0 11px; color: var(--muted); font: 11px/1.5 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
    .article-title { margin: 0 0 30px; color: var(--ink); font: 600 30px/1.32 var(--sans); letter-spacing: -.025em; }
    .source { margin: 32px 0 0; }
    .source a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .body { color: #27332d; font: 19px/1.82 var(--serif); }
    .body p { margin: 0 0 1.35em; }
    .body p:first-child::first-letter { float: left; margin: .1em .11em 0 0; color: var(--green); font-size: 3.65em; line-height: .73; }
    .article-transition { animation: reveal .28s ease both; }
    .footer { margin: 72px 0 0; border-top: 1px solid var(--line); padding-top: 15px; letter-spacing: 0; text-transform: none; }
    .footer a { color: var(--ink); text-decoration: none; }
    @keyframes reveal { from { opacity: .25; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    @media (max-width: 860px) {
      .reader-grid { grid-template-columns: 1fr; gap: 26px; padding: 38px 0 0; }
      .archive { position: static; display: block; max-width: 320px; }
      .levels { position: static; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .levels-title { grid-column: 1 / -1; }
      .level { min-height: 58px; border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
      .level[aria-pressed="true"] { border-color: var(--green); }
      .footer { margin: 52px 0 0; }
    }
    @media (max-width: 520px) {
      .shell { padding: 18px 18px 44px; }
      .top-note { display: none; }
      .levels { grid-template-columns: 1fr; }
      .level { min-height: 42px; }
      .body { font-size: 18px; }
      .article-title { font-size: 25px; line-height: 1.36; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <a class="brand" href="index.html">HN Reader</a>
        <p class="brand-note">Read Hacker News at your English level.</p>
      </div>
    </header>

    <section class="reader-grid" aria-label="文章阅读器">
      <aside class="archive" aria-label="历史文章">
        <p class="archive-title">Calendar</p>
        <div class="calendar" id="archiveList"></div>
      </aside>

      <article class="article-transition" id="article" aria-live="polite">
        <p class="reading-meta" id="readingMeta"></p>
        <h1 class="article-title" id="articleTitle"></h1>
        <div class="body" id="articleBody"></div>
        <p class="source">Source: <a id="sourceLink" href="https://substack.magazinenongrata.com/p/how-i-learned-to-read-again" target="_blank" rel="noreferrer">Magazine Non Grata ↗</a></p>
      </article>

      <nav class="levels" aria-label="阅读难度">
        <p class="levels-title">Choose a level</p>
        <button class="level" type="button" data-level="easy" aria-pressed="true">Easy</button>
        <button class="level" type="button" data-level="medium" aria-pressed="false">Medium</button>
        <button class="level" type="button" data-level="hard" aria-pressed="false">Hard</button>
      </nav>
    </section>

    <footer class="footer">Design by <a href="https://abnerzhao.com" target="_blank" rel="noreferrer">Abner Zhao</a></footer>
  </main>

  <script src="content/articles/articles.js"></script>
  <script>
    const articles = window.HN_READER_ARTICLES;
    const levelButtons = document.querySelectorAll('[data-level]');
    const archiveList = document.getElementById('archiveList');
    const article = document.getElementById('article');
    const sourceLink = document.getElementById('sourceLink');
    const readingMeta = document.getElementById('readingMeta');
    const articleTitle = document.getElementById('articleTitle');
    let activeArticle = Object.keys(articles)[0];
    let activeLevel = 'easy';
    let calendarMonth = new Date(`${articles[activeArticle].date}T00:00:00Z`);
    const escapeAttribute = value => value.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    const renderArticle = () => {
      const story = articles[activeArticle];
      const edition = story.editions[activeLevel];
      const wordCount = edition.paragraphs.join(' ').trim().split(/\s+/).filter(Boolean).length;
      const readingMinutes = Math.max(1, Math.ceil(wordCount / 200));
      sourceLink.href = story.sourceUrl;
      sourceLink.textContent = `${story.sourceName} ↗`;
      readingMeta.textContent = `${wordCount} words · ${readingMinutes} min read`;
      articleTitle.textContent = story.title;
      document.getElementById('articleBody').innerHTML = edition.paragraphs.map(text => `<p>${text}</p>`).join('');
      levelButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.level === activeLevel)));
      renderCalendar();
      article.classList.remove('article-transition');
      void article.offsetWidth;
      article.classList.add('article-transition');
    };

    levelButtons.forEach(button => button.addEventListener('click', () => {
      activeLevel = button.dataset.level;
      renderArticle();
    }));
    const monthFormatter = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const articleByDate = Object.fromEntries(Object.entries(articles).map(([id, story]) => [story.date, id]));
    const moveArticleByDays = days => {
      const activeDate = new Date(`${articles[activeArticle].date}T00:00:00Z`);
      activeDate.setUTCDate(activeDate.getUTCDate() + days);
      const date = activeDate.toISOString().slice(0, 10);
      const id = articleByDate[date];
      if (!id) return false;
      activeArticle = id;
      calendarMonth = new Date(`${articles[activeArticle].date}T00:00:00Z`);
      renderArticle();
      requestAnimationFrame(() => archiveList.querySelector(`[data-article="${activeArticle}"]`)?.focus());
      return true;
    };
    const renderCalendar = () => {
      const year = calendarMonth.getUTCFullYear();
      const month = calendarMonth.getUTCMonth();
      const firstDay = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7;
      const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
      const cells = Array.from({ length: firstDay }, () => '<span class="calendar-day empty"></span>');
      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const id = articleByDate[date];
        cells.push(id ? `<button class="calendar-day has-article" type="button" data-article="${id}" aria-label="Read ${escapeAttribute(articles[id].title)}" title="${escapeAttribute(articles[id].title)}" aria-pressed="${id === activeArticle}">${day}</button>` : `<span class="calendar-day empty">${day}</span>`);
      }
      archiveList.innerHTML = `<div class="calendar-head"><button class="calendar-nav" type="button" data-calendar-nav="-1" aria-label="Previous month">‹</button><p class="calendar-month">${monthFormatter.format(calendarMonth)}</p><button class="calendar-nav" type="button" data-calendar-nav="1" aria-label="Next month">›</button></div><div class="calendar-weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="calendar-days">${cells.join('')}</div>`;
    };
    archiveList.addEventListener('click', event => {
      const calendarNav = event.target.closest('[data-calendar-nav]');
      if (calendarNav) {
        calendarMonth = new Date(Date.UTC(calendarMonth.getUTCFullYear(), calendarMonth.getUTCMonth() + Number(calendarNav.dataset.calendarNav), 1));
        renderCalendar();
        return;
      }
      const button = event.target.closest('[data-article]');
      if (!button) return;
      activeArticle = button.dataset.article;
      calendarMonth = new Date(`${articles[activeArticle].date}T00:00:00Z`);
      renderArticle();
    });
    document.addEventListener('keydown', event => {
      if (event.target.matches('input, textarea, select, [contenteditable="true"]')) return;
      const dayOffset = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[event.key];
      if (!dayOffset || !moveArticleByDays(dayOffset)) return;
      event.preventDefault();
    });
    renderArticle();
  </script>
</body>
</html>
